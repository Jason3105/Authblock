version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Pin Node.js to v20 (LTS)
        - nvm use 20 || nvm install 20
        - node --version
        - npm ci
    build:
      commands:
        - nvm use 20
        # Write environment variables to .env.production for Next.js to use at build-time
        - env | grep -e NEXT_PUBLIC_ -e DATABASE_URL -e ALCHEMY_RPC_URL -e PRIVATE_KEY -e S3_ -e SMTP_ -e OCR_SPACE -e GOOGLE_VISION >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  customHeaders:
    # Firebase signInWithPopup requires cross-origin popup communication.
    # Amplify sets COOP: same-origin by default which blocks window.opener.
    # Setting to unsafe-none restores the behaviour needed for Firebase Auth popups.
    - pattern: '**/*'
      headers:
        - key: Cross-Origin-Opener-Policy
          value: unsafe-none
        - key: Cross-Origin-Embedder-Policy
          value: unsafe-none
